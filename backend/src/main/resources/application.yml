spring:
  application:
    name: zhuatech-ipdesk
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql:3306/zhuatech_ipdesk?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowLoadLocalInfile=false&sslMode=REQUIRED}
    username: ${DATABASE_USER:ipdesk}
    password: ${DATABASE_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        name: IPDESKSESSION
        same-site: strict
        secure: ${COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health

ipdesk:
  scheduler-enabled: ${SCHEDULER_ENABLED:true}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-host: ${MAIL_HOST:}
  mail-port: ${MAIL_PORT:587}
  mail-username: ${MAIL_USERNAME:}
  mail-password: ${MAIL_PASSWORD:}
  mail-from: ${MAIL_FROM:}
  mail-tls: ${MAIL_TLS:true}
